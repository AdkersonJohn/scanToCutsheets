Screens:
  Screen1:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - Rectangle1:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(0, 137, 209, 1)
            Height: =80
            Width: =Parent.Width
      - lblTitle:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =Color.White
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =24
            Text: ="Asset Tag Scanner"
            Width: =Parent.Width
            Y: =20
      - brcScanner:
          Control: BarcodeReader@1.0.25
          Properties:
            BarcodeType: =BarcodeType.Auto
            Height: =220
            OnScan: "= // Capture scanned value                                                                                                                                                                                \n  Set(varScannedValue, Trim(First(brcScanner.Barcodes).Value));                                                                                                                                           \n  Set(varIsSearching, true);                                                                                                                                                                              \n  Set(varShowResult, false);                                                                                                                                                                              \n  Set(varSubmitSuccess, false);                                                                                                                                                                           \n  Set(varShowForm, false);                                                                                                                                                                                \n                                                                                                                                                                                                          \n  // Extract year from asset tag (characters 3-4, e.g., \"23\" from \"EW23-00001\")                                                                                                                           \n  Set(varAssetYear, Value(Mid(varScannedValue, 3, 2)));                                                                                                                                                   \n                                                                                                                                                                                                          \n  // Check if device is too new for 4-year refresh cycle (year > 22)                                                                                                                                      \n  Set(varDeviceTooNew, varAssetYear > 22 || IsBlank(varAssetYear));                                                                                                                                       \n                                                                                                                                                                                                          \n  // Only check SharePoint if device is old enough                                                                                                                                                        \n  If(                                                                                                                                                                                                     \n      !varDeviceTooNew,                                                                                                                                                                                   \n      Set(                                                                                                                                                                                                \n          varMatchRecord,                                                                                                                                                                                 \n          Coalesce(                                                                                                                                                                                       \n              LookUp('FY26 Cut Sheets', 'Legacy Asset Tag' = Trim(varScannedValue)),                                                                                                                      \n              LookUp('FY26 Cut Sheets Part 2', 'Legacy Asset Tag' = Trim(varScannedValue))                                                                                                                \n          )                                                                                                                                                                                               \n      ),                                                                                                                                                                                                  \n      Set(varMatchRecord, Blank())                                                                                                                                                                        \n  );                                                                                                                                                                                                      \n                                                                                                                                                                                                          \n  Set(varMatchFound, !IsBlank(varMatchRecord));                                                                                                                                                           \n                                                                                                                                                                                                          \n  // Nonstandard device check (only for GREEN results)                                                                                                                                                    \n  If(                                                                                                                                                                                                     \n      !varMatchFound && !varDeviceTooNew,                                                                                                                                                                 \n                                                                                                                                                                                                          \n      // Lookup device in inventory                                                                                                                                                                       \n      Set(varDeviceRecord,                                                                                                                                                                                \n          LookUp(RefreshAssetInventory, DeviceName = varScannedValue));                                                                                                                                   \n      Set(varDeviceFound, !IsBlank(varDeviceRecord));                                                                                                                                                    \n                                                                                                                                                                                                          \n      // Determine nonstandard status                                                                                                                                                                     \n      Set(varNonstandardStatus,                                                                                                                                                                           \n          If(                                                                                                                                                                                             \n              !varDeviceFound, \"Unknown\",                                                                                                                                                                 \n              IsBlank(LookUp(colStandardModels,                                                                                                                                                           \n                  Make = varDeviceRecord.Make && Model = varDeviceRecord.Model)),                                                                                                                         \n              \"Yes\",                                                                                                                                                                                      \n              \"No\"                                                                                                                                                                                        \n          )                                                                                                                                                                                               \n      ),                                                                                                                                                                                                  \n                                                                                                                                                                                                          \n      // Not a GREEN result - clear nonstandard state                                                                                                                                                     \n      Set(varDeviceFound, false);                                                                                                                                                                         \n      Set(varNonstandardStatus, \"\")                                                                                                                                                                        \n  );                                                                                                                                                                                                      \n                                                                                                                                                                                                          \n  Set(varIsSearching, false);                                                                                                                                                                             \n  Set(varShowResult, true)                "
            Visible: =!varShowResult
            Width: =300
            X: =(Parent.Width - 300) / 2
            Y: =120
      - circleSuccess:
          Control: Circle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(16, 185, 129, 1)
            Height: =200
            Visible: =varShowResult && !varMatchFound && !varDeviceTooNew && !varShowForm && !varSubmitSuccess
            Width: =200
            X: =(Parent.Width - 200) / 2
            Y: =380
      - iconSuccess:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =Color.White
            Height: =120
            Icon: =Icon.Check
            Visible: =varShowResult && !varMatchFound && !varDeviceTooNew && !varShowForm && !varSubmitSuccess
            Width: =120
            X: =(Parent.Width - 120) / 2
            Y: =420
      - lblSuccessTitle:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(16, 185, 129, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =22
            Text: ="CUT SHEET NEEDED"
            Visible: =varShowResult && !varMatchFound && !varDeviceTooNew && !varShowForm && !varSubmitSuccess
            Width: =Parent.Width
            Y: =580
      - lblSuccessAsset:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Size: =18
            Text: =varScannedValue
            Visible: =varShowResult && !varMatchFound && !varDeviceTooNew && !varShowForm && !varSubmitSuccess
            Width: =Parent.Width
            Y: =615
      - rectNSBanner:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 165, 0, 0.15)
            BorderColor: =RGBA(255, 140, 0, 1)
            BorderThickness: =0
            Height: =40
            Visible: =varShowResult && !varMatchFound && !varDeviceTooNew && varNonstandardStatus <> "No" && varNonstandardStatus <> "" && !varShowForm && !varSubmitSuccess
            Width: =Parent.Width - 80
            X: =40
            Y: =650
      - rectNSBorderLeft:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(255, 140, 0, 1)
            Height: =40
            Visible: =rectNSBanner.Visible
            Width: =3
            X: =40
            Y: =650
      - lblNSWarning:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Left
            Color: =RGBA(180, 100, 0, 1)
            Font: =Font.'Open Sans'
            Height: =40
            Size: =12
            Text: =If(varNonstandardStatus = "Unknown", "⚠ Device not in inventory — verify asset tag", "⚠ Nonstandard: " & varDeviceRecord.Make & " " & varDeviceRecord.Model)
            VerticalAlign: =VerticalAlign.Middle
            Visible: =rectNSBanner.Visible
            Width: =Parent.Width - 100
            X: =50
            Y: =650
      - circleFailure:
          Control: Circle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: '=RGBA(239, 68, 68, 1) '
            Height: =200
            Visible: =varShowResult && varMatchFound
            Width: =200
            X: =(Parent.Width - 200) / 2
            Y: =380
      - iconFailure:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =Color.White
            Height: =120
            Icon: =Icon.Cancel
            Visible: =varShowResult && varMatchFound
            Width: =120
            X: '=(Parent.Width - 120) / 2 '
            Y: =420
      - lblFailureTitle:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(239, 68, 68, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =22
            Text: ="ALREADY HAS CUT SHEET"
            Visible: =varShowResult && varMatchFound
            Width: =Parent.Width
            Y: =600
      - lblFailureAsset:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Size: =18
            Text: =varScannedValue
            Visible: =varShowResult && varMatchFound
            Width: =Parent.Width
            Y: =640
      - lblExistingEWR:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Text: ="ALREADY IN SYSTEM"
            Visible: =false
            X: =80
            Y: =100
      - lblSearching:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Size: =20
            Text: ="Searching..."
            Visible: =varIsSearching
            Width: =Parent.Width
            Y: =450
      - btnScanAgain:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =Color.White
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: '=RGBA(0, 137, 209, 1) '
            Font: =Font.'Open Sans'
            Height: =80
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: =Set(varShowResult, false); Set(varScannedValue, Blank())
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="Scan Another"
            Visible: =varShowResult
            Width: =200
            X: =(Parent.Width - 200) / 2
            Y: =830
      - rectOfflineOverlay:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(0, 0, 0, 0.85)
            Height: =Parent.Height
            Visible: =!Connection.Connected
            Width: =Parent.Width
      - iconWifiWarning:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(251, 191, 36, 1)
            Height: =80
            Icon: =Icon.Warning
            Visible: =!Connection.Connected
            Width: =80
            X: =(Parent.Width - 80) / 2
            Y: =280
      - lblWifiWarning:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =Color.White
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =20
            Text: ="Connect to WiFi to Continue"
            Visible: =!Connection.Connected
            Width: =Parent.Width - 40
            X: =20
            Y: =380
      - lblInstructions:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(107, 114, 128, 1)
            Font: =Font.'Open Sans'
            Size: =16
            Text: ="Point camera at asset tag barcode"
            Visible: =!varShowResult && !varIsSearching && Connection.Connected
            Width: =Parent.Width
            Y: =360
      - debugLbl:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Text: "=\"Scanned: \" & varScannedValue & \" | Match: \" & varMatchFound "
            Visible: =false
            Y: =100
      - circleTooNew:
          Control: Circle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(251, 191, 36, 1)
            Height: =200
            Visible: =varShowResult && varDeviceTooNew && !varShowForm && !varSubmitSuccess
            Width: |
              =200
            X: =(Parent.Width - 200) / 2
            Y: =380
      - iconTooNew:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =Color.White
            Height: =120
            Icon: =Icon.Warning
            Visible: =varShowResult && varDeviceTooNew && !varShowForm && !varSubmitSuccess
            Width: =120
            X: =(Parent.Width - 120) / 2
            Y: =420
      - lblTooNewTitle:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(251, 191, 36, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =22
            Text: ="DEVICE NOT OLD ENOUGH"
            Visible: =varShowResult && varDeviceTooNew && !varShowForm && !varSubmitSuccess
            Width: =Parent.Width
            Y: =600
      - lblTooNewAsset:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Size: =18
            Text: =varScannedValue
            Visible: =varShowResult && varDeviceTooNew && !varShowForm && !varSubmitSuccess
            Width: =Parent.Width
            Y: =640
      - lblTooNewInfo:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(107, 114, 128, 1)
            Font: =Font.'Open Sans'
            Size: =14
            Text: ="Year 20" & Text(varAssetYear) & " - Not eligible until 4-year cycle"
            Visible: =varShowResult && varDeviceTooNew && !varShowForm && !varSubmitSuccess
            X: =60
            Y: =680
      - rectFormOverlay:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(0, 0, 0, 0.7)
            Height: =Parent.Height
            Visible: =varShowForm
            Width: =Parent.Width
      - rectFormContainer:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =Color.White
            Height: =520
            Visible: =varShowForm
            Width: =Parent.Width - 40
            X: =20
            Y: =150
      - lblFormTitle:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 137, 209, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =40
            Size: =20
            Text: =If(varIsEditing, "Edit Item", "Add to Session")
            Visible: =varShowForm
            Width: =Parent.Width - 80
            X: =40
            Y: =170
      - lblFormAssetTag:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =16
            Text: |-
              ="Asset Tag: " & varCurrentAssetTag
            Visible: =varShowForm
            Width: =Parent.Width - 80
            X: =40
            Y: =210
      - lblSerialNumber:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Size: =14
            Text: ="Serial Number *"
            Visible: =varShowForm
            Width: =Parent.Width - 80
            X: =40
            Y: =250
      - txtSerialNumber:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =""
            Font: =Font.'Open Sans'
            Height: =40
            HintText: '="Enter serial number" '
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            Visible: =varShowForm
            Width: =Parent.Width - 80
            X: =40
            Y: =275
      - lblDepartment:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Size: =14
            Text: ="Department *"
            Visible: =varShowForm
            Width: =Parent.Width - 80
            X: =40
            Y: =330
      - txtDepartment:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =""
            Font: =Font.'Open Sans'
            Height: =40
            HintText: ="Enter department"
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            Visible: =varShowForm
            Width: =Parent.Width - 80
            X: =40
            Y: =355
      - lblLocation:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Text: ="Location *"
            Visible: =varShowForm
            X: =40
            Y: =410
      - txtLocation:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =""
            Font: =Font.'Open Sans'
            Height: =40
            HintText: ="Enter location"
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            Visible: =varShowForm
            Width: =Parent.Width - 80
            X: =40
            Y: =435
      - lblModel:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Size: =14
            Text: ="Model *"
            Visible: =varShowForm
            Width: =Parent.Width - 80
            X: =40
            Y: =490
      - txtModel:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =""
            Font: =Font.'Open Sans'
            Height: =40
            HintText: ="Enter model"
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            Visible: =varShowForm
            Width: =Parent.Width - 80
            X: =40
            Y: =515
      - btnSaveItem:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =Color.White
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(16, 185, 129, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =45
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: "=If(                                                                                                                                                                                                     \n      IsBlank(txtSerialNumber.Text) || IsBlank(txtDepartment.Text) || IsBlank(txtLocation.Text) || IsBlank(txtModel.Text),                                                                                \n      Notify(\"All fields are required\", NotificationType.Error),                                                                                                                                          \n      Collect(                                                                                                                                                                                            \n          colSessionList,                                                                                                                                                                                 \n          {                                                                                                                                                                                               \n              ID: If(CountRows(colSessionList) = 0, 1, Max(colSessionList, ID) + 1),                                                                                                                      \n              AssetTag: varCurrentAssetTag,                                                                                                                                                               \n              SerialNumber: txtSerialNumber.Text,                                                                                                                                                         \n              Department: txtDepartment.Text,                                                                                                                                                             \n              Location: txtLocation.Text,                                                                                                                                                                 \n              Model: txtModel.Text,                                                                                                                                                                       \n              DateScanned: Now(),                                                                                                                                                                         \n              Operator: User().FullName                                                                                                                                                                   \n          }                                                                                                                                                                                               \n      );                                                                                                                                                                                                  \n      Reset(txtSerialNumber);                                                                                                                                                                             \n      Reset(txtDepartment);                                                                                                                                                                               \n      Reset(txtLocation);                                                                                                                                                                                 \n      Reset(txtModel);                                                                                                                                                                                    \n      Set(varShowForm, false)                                                                                                                                                                             \n  )     "
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: =If(varIsEditing, "Update", "Add to List")
            Visible: =varShowForm
            Width: =140
            X: =40
            Y: =580
      - btnCancelForm:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =Color.White
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(107, 114, 128, 1)
            Font: =Font.'Open Sans'
            Height: =45
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: "=Reset(txtSerialNumber);                                                                                                                                                                                 \n  Reset(txtDepartment);                                                                                                                                                                                   \n  Reset(txtLocation);                                                                                                                                                                                     \n  Reset(txtModel);                                                                                                                                                                                        \n  Set(varShowForm, false) "
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="Cancel"
            Visible: =varShowForm
            Width: =100
            X: =Parent.Width - 140
            Y: =580
      - lblSessionCount:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(107, 114, 128, 1)
            Font: =Font.'Open Sans'
            Height: =30
            Size: =14
            Text: =CountRows(colSessionList) & " item(s) in session"
            Visible: =!varShowForm && CountRows(colSessionList) > 0 && !varSubmitSuccess
            Width: =Parent.Width
            Y: =700
      - btnReviewList:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =Color.White
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(59, 130, 246, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =50
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: =Navigate(Screen2, ScreenTransition.Fade)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="Review List (" & CountRows(colSessionList) & ")"
            Visible: =CountRows(colSessionList) > 0 && !varShowForm && !varSubmitSuccess
            Width: =200
            X: =(Parent.Width - 200) / 2
            Y: =800
      - rectSuccessOverlay:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(16, 185, 129, 0.95)
            Height: =Parent.Height
            Visible: =varSubmitSuccess
            Width: = Parent.Width
      - iconSuccessSubmit:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =Color.White
            Height: =80
            Icon: =Icon.CheckBadge
            Visible: =varSubmitSuccess
            Width: =80
            X: =(Parent.Width - 80) / 2
            Y: =280
      - lblSuccessSubmit:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =Color.White
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =24
            Text: ="Successfully Submitted!"
            Visible: =varSubmitSuccess
            Width: =Parent.Width
            Y: =380
      - btnReturnToScan:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: = RGBA(16, 185, 129, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =Color.White
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =50
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              = Set(varSubmitSuccess, false);                                                                                                                                                                           
                Set(varShowResult, false);                                                                                                                                                                              
                Set(varScannedValue, "")
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="Return to Scanning"
            Visible: =varSubmitSuccess
            Width: =200
            X: =(Parent.Width - 200) / 2
            Y: =460
      - btnAddToSession:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =Color.White
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(16, 185, 129, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =90
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =Set(varShowForm, true);                                                                                                                                                                                 
                Set(varCurrentAssetTag, varScannedValue);                                                                                                                                                               
                Set(varIsEditing, false)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="Add to Session"
            Visible: =varShowResult && !varMatchFound && !varDeviceTooNew && !varShowForm && !varSubmitSuccess
            Width: =200
            X: =(Parent.Width - 200) / 2
            Y: =700
