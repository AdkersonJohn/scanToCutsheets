Screens:
  Screen1:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - Rectangle1:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(0, 137, 209, 1)
            Height: =80
            Width: =Parent.Width
      - lblTitle:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =Color.White
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =24
            Text: ="Asset Tag Scanner"
            Width: =Parent.Width
            Y: =20
      - brcScanner:
          Control: BarcodeReader@1.0.25
          Properties:
            BarcodeType: =BarcodeType.Auto
            Height: =220
            OnScan: |
              =// Capture scanned value
              Set(varScannedValue, Trim(First(brcScanner.Barcodes).Value));
              Set(varIsSearching, true);
              Set(varShowResult, false);
              Set(varSubmitSuccess, false);

              // Check both SharePoint lists for existing cut sheet
              Set(
                  varMatchRecord,
                  Coalesce(
                      LookUp('FY26 Cut Sheets', 'Legacy Asset Tag' = Trim(First(brcScanner.Barcodes).Value)),
                      LookUp('FY26 Cut Sheets Part 2', 'Legacy Asset Tag' = Trim(First(brcScanner.Barcodes).Value))
                  )
              );

              Set(varMatchFound, !IsBlank(varMatchRecord));
              Set(varIsSearching, false);
              Set(varShowResult, true);

              // AUTO-TRIGGER: If GREEN result (needs cut sheet), show form popup
              If(
                  varShowResult && !varMatchFound,
                  Set(varShowForm, true);
                  Set(varCurrentAssetTag, varScannedValue);
                  Set(varIsEditing, false)
              )
            Width: =300
            X: =(Parent.Width - 300) / 2
            Y: =120
      - circleSuccess:
          Control: Circle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(16, 185, 129, 1)
            Height: =200
            Visible: =varShowResult && !varMatchFound && !varShowForm && !varSubmitSuccess
            Width: =200
            X: =(Parent.Width - 200) / 2
            Y: =380
      - iconSuccess:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =Color.White
            Height: =120
            Icon: =Icon.Check
            Visible: =varShowResult && !varMatchFound && !varShowForm && !varSubmitSuccess
            Width: =120
            X: =(Parent.Width - 120) / 2
            Y: =420
      - lblSuccessTitle:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(16, 185, 129, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =22
            Text: ="CUT SHEET NEEDED"
            Visible: =varShowResult && !varMatchFound && !varShowForm && !varSubmitSuccess
            Width: =Parent.Width
            X: =40
            Y: =600
      - lblSuccessAsset:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Size: =18
            Text: =varScannedValue
            Visible: =varShowResult && !varMatchFound && !varShowForm && !varSubmitSuccess
            Width: =Parent.Width
            X: =60
            Y: =640
      - circleFailure:
          Control: Circle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(239, 68, 68, 1)
            Height: =200
            Visible: =varShowResult && varMatchFound && !varShowForm && !varSubmitSuccess
            Width: =200
            X: =(Parent.Width - 200) / 2
            Y: =380
      - iconFailure:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =Color.White
            Height: =120
            Icon: =Icon.Cancel
            Visible: =varShowResult && varMatchFound && !varShowForm && !varSubmitSuccess
            Width: =120
            X: =(Parent.Width - 120) / 2
            Y: =420
      - lblFailureTitle:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(239, 68, 68, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =22
            Text: ="ALREADY HAS CUT SHEET"
            Visible: =varShowResult && varMatchFound && !varShowForm && !varSubmitSuccess
            Width: =Parent.Width
            X: =80
            Y: =600
      - lblFailureAsset:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Size: =18
            Text: =varScannedValue
            Visible: =varShowResult && varMatchFound && !varShowForm && !varSubmitSuccess
            Width: =Parent.Width
            X: =80
            Y: =640
      - lblSearching:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Size: =20
            Text: ="Searching..."
            Visible: =varIsSearching
            Width: =Parent.Width
            Y: =450
      - btnScanAgain:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =Color.White
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(0, 137, 209, 1)
            Font: =Font.'Open Sans'
            Height: =50
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: =Set(varShowResult, false); Set(varScannedValue, Blank())
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="Scan Another"
            Visible: =varShowResult && !varShowForm && !varSubmitSuccess
            Width: =200
            X: =(Parent.Width - 200) / 2
            Y: =720
      - lblSessionCount:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(107, 114, 128, 1)
            Font: =Font.'Open Sans'
            Size: =14
            Text: =CountRows(colSessionList) & " item(s) in session"
            Visible: =!varShowForm && CountRows(colSessionList) > 0 && !varSubmitSuccess
            Width: =Parent.Width
            Height: =30
            Y: =680
      - btnReviewList:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =Color.White
            Fill: =RGBA(59, 130, 246, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =50
            HoverFill: =ColorFade(RGBA(59, 130, 246, 1), -20%)
            OnSelect: =Navigate(Screen2, ScreenTransition.Fade)
            Text: ="Review List (" & CountRows(colSessionList) & ")"
            Visible: =varShowResult && CountRows(colSessionList) > 0 && !varShowForm && !varSubmitSuccess
            Width: =200
            X: =(Parent.Width - 200) / 2
            Y: =780
      - rectOfflineOverlay:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(0, 0, 0, 0.85)
            Height: =Parent.Height
            Visible: =!Connection.Connected
            Width: =Parent.Width
      - iconWifiWarning:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(251, 191, 36, 1)
            Height: =80
            Icon: =Icon.Warning
            Visible: =!Connection.Connected
            Width: =80
            X: =(Parent.Width - 80) / 2
            Y: =280
      - lblWifiWarning:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =Color.White
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =20
            Text: ="Connect to WiFi to Continue"
            Visible: =!Connection.Connected
            Width: =Parent.Width - 40
            X: =20
            Y: =380
      - lblInstructions:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(107, 114, 128, 1)
            Font: =Font.'Open Sans'
            Size: =16
            Text: ="Point camera at asset tag barcode"
            Visible: =!varShowResult && !varIsSearching && Connection.Connected && !varSubmitSuccess
            Width: =Parent.Width
            Y: =360
      # Form Popup Overlay
      - rectFormOverlay:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(0, 0, 0, 0.7)
            Height: =Parent.Height
            Width: =Parent.Width
            Visible: =varShowForm
      # Form Container
      - rectFormContainer:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Color.White
            Height: =500
            Width: =Parent.Width - 40
            Visible: =varShowForm
            X: =20
            Y: =(Parent.Height - 500) / 2
      - lblFormTitle:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =RGBA(0, 137, 209, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =20
            Text: =If(varIsEditing, "Edit Item", "Add to Session")
            Visible: =varShowForm
            Width: =Parent.Width - 80
            Height: =40
            X: =40
            Y: =(Parent.Height - 500) / 2 + 20
      - lblFormAssetTag:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =16
            Text: ="Asset Tag: " & varCurrentAssetTag
            Visible: =varShowForm
            Width: =Parent.Width - 80
            X: =40
            Y: =(Parent.Height - 500) / 2 + 60
      - lblSerialNumber:
          Control: Label@2.5.1
          Properties:
            Font: =Font.'Open Sans'
            Size: =14
            Text: ="Serial Number *"
            Visible: =varShowForm
            Width: =Parent.Width - 80
            X: =40
            Y: =(Parent.Height - 500) / 2 + 100
      - txtSerialNumber:
          Control: TextInput@0.0.53
          Properties:
            BorderColor: =If(IsBlank(Self.Text), RGBA(239, 68, 68, 1), RGBA(200, 200, 200, 1))
            Default: =If(varIsEditing, LookUp(colSessionList, ID = varEditIndex).SerialNumber, "")
            HintText: ="Enter serial number"
            Height: =45
            Visible: =varShowForm
            Width: =Parent.Width - 80
            X: =40
            Y: =(Parent.Height - 500) / 2 + 125
      - lblDepartment:
          Control: Label@2.5.1
          Properties:
            Font: =Font.'Open Sans'
            Size: =14
            Text: ="Department *"
            Visible: =varShowForm
            Width: =Parent.Width - 80
            X: =40
            Y: =(Parent.Height - 500) / 2 + 180
      - txtDepartment:
          Control: TextInput@0.0.53
          Properties:
            BorderColor: =If(IsBlank(Self.Text), RGBA(239, 68, 68, 1), RGBA(200, 200, 200, 1))
            Default: =If(varIsEditing, LookUp(colSessionList, ID = varEditIndex).Department, "")
            HintText: ="Enter department"
            Height: =45
            Visible: =varShowForm
            Width: =Parent.Width - 80
            X: =40
            Y: =(Parent.Height - 500) / 2 + 205
      - lblLocation:
          Control: Label@2.5.1
          Properties:
            Font: =Font.'Open Sans'
            Size: =14
            Text: ="Location *"
            Visible: =varShowForm
            Width: =Parent.Width - 80
            X: =40
            Y: =(Parent.Height - 500) / 2 + 260
      - txtLocation:
          Control: TextInput@0.0.53
          Properties:
            BorderColor: =If(IsBlank(Self.Text), RGBA(239, 68, 68, 1), RGBA(200, 200, 200, 1))
            Default: =If(varIsEditing, LookUp(colSessionList, ID = varEditIndex).Location, "")
            HintText: ="Enter location"
            Height: =45
            Visible: =varShowForm
            Width: =Parent.Width - 80
            X: =40
            Y: =(Parent.Height - 500) / 2 + 285
      - lblModel:
          Control: Label@2.5.1
          Properties:
            Font: =Font.'Open Sans'
            Size: =14
            Text: ="Model *"
            Visible: =varShowForm
            Width: =Parent.Width - 80
            X: =40
            Y: =(Parent.Height - 500) / 2 + 340
      - txtModel:
          Control: TextInput@0.0.53
          Properties:
            BorderColor: =If(IsBlank(Self.Text), RGBA(239, 68, 68, 1), RGBA(200, 200, 200, 1))
            Default: =If(varIsEditing, LookUp(colSessionList, ID = varEditIndex).Model, "")
            HintText: ="Enter model"
            Height: =45
            Visible: =varShowForm
            Width: =Parent.Width - 80
            X: =40
            Y: =(Parent.Height - 500) / 2 + 365
      - btnSaveItem:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =Color.White
            Fill: =RGBA(16, 185, 129, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =45
            HoverFill: =ColorFade(RGBA(16, 185, 129, 1), -20%)
            OnSelect: |
              =If(
                  // Validate all fields
                  IsBlank(txtSerialNumber.Text) ||
                  IsBlank(txtDepartment.Text) ||
                  IsBlank(txtLocation.Text) ||
                  IsBlank(txtModel.Text),

                  Notify("All fields are required", NotificationType.Error),

                  // Check if editing existing or adding new
                  If(
                      varIsEditing,
                      // UPDATE existing item
                      UpdateIf(
                          colSessionList,
                          ID = varEditIndex,
                          {
                              SerialNumber: txtSerialNumber.Text,
                              Department: txtDepartment.Text,
                              Location: txtLocation.Text,
                              Model: txtModel.Text
                          }
                      ),
                      // ADD new item
                      Collect(
                          colSessionList,
                          {
                              ID: If(CountRows(colSessionList) = 0, 1, Max(colSessionList, ID) + 1),
                              AssetTag: varCurrentAssetTag,
                              SerialNumber: txtSerialNumber.Text,
                              Department: txtDepartment.Text,
                              Location: txtLocation.Text,
                              Model: txtModel.Text,
                              DateScanned: Now(),
                              Operator: User().FullName
                          }
                      )
                  );

                  // Clear form and close
                  Reset(txtSerialNumber);
                  Reset(txtDepartment);
                  Reset(txtLocation);
                  Reset(txtModel);
                  Set(varShowForm, false);
                  Set(varIsEditing, false)
              )
            Text: =If(varIsEditing, "Update", "Add to List")
            Visible: =varShowForm
            Width: =140
            X: =40
            Y: =(Parent.Height - 500) / 2 + 430
      - btnCancelForm:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =Color.White
            Fill: =RGBA(107, 114, 128, 1)
            Font: =Font.'Open Sans'
            Height: =45
            HoverFill: =ColorFade(RGBA(107, 114, 128, 1), -20%)
            OnSelect: |
              =Reset(txtSerialNumber);
               Reset(txtDepartment);
               Reset(txtLocation);
               Reset(txtModel);
               Set(varShowForm, false);
               Set(varIsEditing, false)
            Text: ="Cancel"
            Visible: =varShowForm
            Width: =100
            X: =Parent.Width - 140
            Y: =(Parent.Height - 500) / 2 + 430
      # Success Overlay (after Excel submission)
      - rectSuccessOverlay:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(16, 185, 129, 0.95)
            Height: =Parent.Height
            Width: =Parent.Width
            Visible: =varSubmitSuccess
      - iconSuccessSubmit:
          Control: Classic/Icon@2.5.0
          Properties:
            Color: =Color.White
            Height: =80
            Icon: =Icon.CheckBadge
            Visible: =varSubmitSuccess
            Width: =80
            X: =(Parent.Width - 80) / 2
            Y: =280
      - lblSuccessSubmit:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =Color.White
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =24
            Text: ="Successfully Submitted!"
            Visible: =varSubmitSuccess
            Width: =Parent.Width
            Y: =380
      - btnReturnToScan:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(16, 185, 129, 1)
            Fill: =Color.White
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =50
            HoverFill: =ColorFade(Color.White, -10%)
            OnSelect: |
              =Set(varSubmitSuccess, false);
               Set(varShowResult, false);
               Set(varScannedValue, Blank())
            Text: ="Return to Scanning"
            Visible: =varSubmitSuccess
            Width: =200
            X: =(Parent.Width - 200) / 2
            Y: =460
      - debugLbl:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Text: ="Scanned: " & varScannedValue & " | Match: " & varMatchFound & " | Items: " & CountRows(colSessionList)
            Visible: =false
            X: =80
            Y: =100
