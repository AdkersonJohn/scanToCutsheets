Screens:
  Screen2:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - rectHeader2:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(0, 137, 209, 1)
            Height: =80
            Width: =Parent.Width
      - lblTitle2:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =Color.White
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =40
            Size: =24
            Text: ="Review Session"
            Width: =Parent.Width
            Y: =20
      - btnBack:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =Color.White
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =Color.Transparent
            Font: =Font.'Open Sans'
            Height: =40
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: '=Navigate(Screen1, ScreenTransition.Fade) '
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="< Back"
            Width: =80
            X: =10
            Y: =20
      - lblItemCount:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Size: =16
            Text: =CountRows(colSessionList) & " item(s) ready to submit"
            Width: =Parent.Width
            Y: =100
      - galSessionList:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =Parent.Height - 280
            Items: =colSessionList
            TemplateSize: =100
            Width: =Parent.Width - 20
            X: =10
            Y: =140
          Children:
            - rectItemBg:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(249, 250, 251, 1)
                  Height: =Parent.TemplateHeight - 10
                  OnSelect: =Select(Parent)
                  Width: =Parent.TemplateWidth - 10
                  X: =5
                  Y: =5
            - lblGalAssetTag:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Bold
                  Size: =16
                  Text: =ThisItem.AssetTag
                  Width: =Parent.TemplateWidth - 130
                  X: =15
                  Y: =10
            - lblGalModel:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(107, 114, 128, 1)
                  Font: =Font.'Open Sans'
                  Size: =14
                  Text: =If(!IsBlank(ThisItem.Make), ThisItem.Make & " ", "") & ThisItem.Model
                  Width: =Parent.TemplateWidth - 130
                  X: =15
                  Y: =35
            - lblGalDetails:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(156, 163, 175, 1)
                  Font: =Font.'Open Sans'
                  Size: =12
                  Text: =ThisItem.Department & " | " & ThisItem.Location
                  Width: =Parent.TemplateWidth - 130
                  X: =15
                  Y: =58
            - lblGalNSBadge:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  Color: =Color.White
                  Fill: =If(ThisItem.Nonstandard = "Unknown", RGBA(251, 191, 36, 1), RGBA(255, 140, 0, 1))
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Bold
                  Height: =20
                  Size: =9
                  Text: ="NS"
                  VerticalAlign: =VerticalAlign.Middle
                  Visible: =ThisItem.Nonstandard = "Yes" || ThisItem.Nonstandard = "Unknown"
                  Width: =30
                  X: =Parent.TemplateWidth - 130
                  Y: =10
            - btnGalEdit:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =Color.White
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(59, 130, 246, 1)
                  Font: =Font.'Open Sans'
                  Height: =35
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  OnSelect: |-
                    =Set(varCurrentAssetTag, ThisItem.AssetTag);                                                                                                                                                             
                      Set(varEditIndex, ThisItem.ID);                                                                                                                                                                         
                      Set(varIsEditing, true);                                                                                                                                                                                
                      Navigate(Screen1, ScreenTransition.Fade);                                                                                                                                                               
                      Set(varShowForm, true)
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Text: ="Edit"
                  Width: =50
                  X: =Parent.TemplateWidth - 120
                  Y: =30
            - btnGalRemove:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =Color.White
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(239, 68, 68, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Bold
                  Height: =35
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  OnSelect: =Remove(colSessionList, ThisItem)
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Text: ="X"
                  Width: =40
                  X: =Parent.TemplateWidth - 60
                  Y: =30
      - btnSubmitAll:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =Color.White
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisplayMode: =If(varIsSubmitting || CountRows(colSessionList) = 0, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(16, 185, 129, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =55
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: "=Set(varIsSubmitting, true);                                                                                                                                                                             \n  ForAll(                                                                                                                                                                                                 \n      colSessionList,                                                                                                                                                                                     \n      Patch(                                                                                                                                                                                              \n          Table1,                                                                                                                                                                                         \n          Defaults(Table1),                                                                                                                                                                               \n          {                                                                                                                                                                                               \n              'Date Scanned': Text(Now(), \"yyyy-mm-dd hh:mm:ss\"),                                                                                                                                         \n              'Asset Tag': AssetTag,                                                                                                                                                                      \n              'Serial Number': SerialNumber,                                                                                                                                                              \n              Department: Department,                                                                                                                                                                     \n              Location: Location,                                                                                                                                                                         \n              Operator: User().FullName,                                                                                                                                                                  \n              Model: Model                                                                                                                                                                                \n          }                                                                                                                                                                                               \n      )                                                                                                                                                                                                   \n  );                                                                                                                                                                                                      \n  Clear(colSessionList);                                                                                                                                                                                  \n  Set(varIsSubmitting, false);                                                                                                                                                                            \n  Set(varSubmitSuccess, true);                                                                                                                                                                            \n  Navigate(Screen1, ScreenTransition.Fade)   "
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: =If(varIsSubmitting, "Submitting...", "Submit All to Excel")
            Width: =250
            X: =(Parent.Width - 250) / 2
            Y: =Parent.Height - 120
      - lblEmptyState:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(156, 163, 175, 1)
            Font: =Font.'Open Sans'
            Size: =16
            Text: ="No items in session. Go back and scan some assets!"
            Visible: =CountRows(colSessionList) = 0
            Width: =Parent.Width - 40
            X: =20
            Y: =300
