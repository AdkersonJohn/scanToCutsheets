# =============================================================================
# Azure Static Web Apps CI/CD Pipeline
# =============================================================================
# This pipeline handles the complete deployment lifecycle for the Scan to Cut
# Sheets Teams Tab App, including:
#   - Linting and type checking
#   - Unit test execution with coverage
#   - Security vulnerability scanning
#   - Frontend build and deployment to Azure Static Web Apps
#   - Backend Azure Functions build and deployment
#   - Post-deployment verification
#
# Pipeline stages are ordered to fail fast and catch issues early:
#   1. Lint & Type Check (fastest, catches syntax/type errors)
#   2. Security Scan (catches dependency vulnerabilities)
#   3. Test (catches logic errors)
#   4. Build (validates production build)
#   5. Deploy (pushes to Azure)
#   6. Verify (confirms deployment health)
# =============================================================================

name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # Cache keys for dependency caching
  CACHE_KEY_PREFIX: node-modules

jobs:
  # ===========================================================================
  # Job: Lint, Type Check, and Security Scan
  # ===========================================================================
  # Runs static analysis to catch issues before expensive test/build steps.
  # This job runs in parallel with the security scan for speed.
  # ===========================================================================
  lint-and-typecheck:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Lint & Type Check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: |
          # Check if eslint is available, skip gracefully if not configured
          if npm list eslint 2>/dev/null | grep -q eslint; then
            npm run lint
          else
            echo "ESLint not configured - skipping lint step"
            echo "To add linting, install eslint: npm install -D eslint @typescript-eslint/eslint-plugin @typescript-eslint/parser"
          fi
        continue-on-error: false

      - name: Run TypeScript type check
        run: npx tsc -b
        continue-on-error: false

  # ===========================================================================
  # Job: Security Vulnerability Scan
  # ===========================================================================
  # Scans dependencies for known vulnerabilities using npm audit.
  # Runs in parallel with lint/typecheck for speed.
  # ===========================================================================
  security-scan:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Security Scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Run npm audit with moderate level - fails on moderate, high, or critical
      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate
        continue-on-error: true  # Don't fail pipeline, but report

      # Audit backend dependencies separately
      - name: Audit backend dependencies
        working-directory: backend
        run: |
          npm ci
          npm audit --audit-level=moderate
        continue-on-error: true  # Don't fail pipeline, but report

  # ===========================================================================
  # Job: Run Tests
  # ===========================================================================
  # Executes the full Vitest test suite with coverage reporting.
  # Depends on lint/typecheck passing to avoid running tests on broken code.
  # ===========================================================================
  test:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    needs: [lint-and-typecheck]
    runs-on: ubuntu-latest
    name: Run Tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest with coverage
        run: npm run test:coverage
        env:
          # Test environment variables (use test/mock values)
          VITE_AZURE_CLIENT_ID: test-client-id
          VITE_AZURE_TENANT_ID: test-tenant-id
          VITE_AZURE_REDIRECT_URI: http://localhost:5173
          VITE_API_BASE_URL: http://localhost:7071/api
          VITE_SHAREPOINT_SITE_ID: test-site-id
          VITE_SHAREPOINT_LIST_ID: test-list-id

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      # Post coverage summary to PR
      - name: Coverage Summary
        if: github.event_name == 'pull_request'
        run: |
          echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            echo "Coverage report generated successfully." >> $GITHUB_STEP_SUMMARY
          else
            echo "See coverage artifacts for details." >> $GITHUB_STEP_SUMMARY
          fi

  # ===========================================================================
  # Job: Build Frontend
  # ===========================================================================
  # Builds the Vite production bundle.
  # Depends on tests passing to avoid deploying broken code.
  # ===========================================================================
  build-frontend:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    name: Build Frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          # Production environment variables from GitHub repository variables
          VITE_AZURE_CLIENT_ID: ${{ vars.VITE_AZURE_CLIENT_ID }}
          VITE_AZURE_TENANT_ID: ${{ vars.VITE_AZURE_TENANT_ID }}
          VITE_AZURE_REDIRECT_URI: ${{ vars.VITE_AZURE_REDIRECT_URI }}
          VITE_TEAMS_APP_ID_URI: ${{ vars.VITE_TEAMS_APP_ID_URI }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SHAREPOINT_SITE_ID: ${{ vars.VITE_SHAREPOINT_SITE_ID }}
          VITE_SHAREPOINT_LIST_ID: ${{ vars.VITE_SHAREPOINT_LIST_ID }}

      - name: Verify build output
        run: |
          echo "Checking build output..."
          ls -la dist/
          if [ ! -f dist/index.html ]; then
            echo "ERROR: index.html not found in dist/"
            exit 1
          fi
          echo "Build output verified successfully."

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  # ===========================================================================
  # Job: Build Backend (Azure Functions)
  # ===========================================================================
  # Builds the TypeScript Azure Functions backend.
  # Runs in parallel with frontend build for speed.
  # ===========================================================================
  build-backend:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    name: Build Backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Verify backend build output
        run: |
          echo "Checking backend build output..."
          ls -la backend/dist/
          if [ ! -f backend/dist/exchange-token/index.js ]; then
            echo "ERROR: exchange-token function not found in dist/"
            exit 1
          fi
          echo "Backend build output verified successfully."

      - name: Prepare backend for deployment
        run: |
          # Copy necessary files for Azure Functions deployment
          cp backend/host.json backend/dist/
          cp -r backend/exchange-token/function.json backend/dist/exchange-token/

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            backend/dist/
            backend/package.json
            backend/package-lock.json
            backend/host.json
          retention-days: 1

  # ===========================================================================
  # Job: Deploy to Azure Static Web Apps
  # ===========================================================================
  # Deploys the frontend and API to Azure Static Web Apps.
  # Only runs on main branch push or for PR preview environments.
  # ===========================================================================
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    name: Deploy to Azure
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.static_web_app_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend/

      - name: Setup backend for deployment
        run: |
          # Ensure the API directory structure is correct for Azure Static Web Apps
          mkdir -p api
          cp -r backend/dist/* api/
          cp backend/host.json api/

          # Install production dependencies for the API
          cd api
          # Create a minimal package.json for the API
          echo '{"name":"scan-to-cutsheets-api","dependencies":{"@azure/functions":"^3.5.0","@azure/msal-node":"^2.6.0"}}' > package.json
          npm install --production

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          # Pre-built frontend
          app_location: "dist"
          output_location: ""
          skip_app_build: true
          # API deployment temporarily disabled - frontend only for now
          # api_location: "api"
          # skip_api_build: true

      - name: Output deployment URL
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Frontend deployed successfully." >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job: Post-Deployment Verification
  # ===========================================================================
  # Runs smoke tests against the deployed application to verify health.
  # ===========================================================================
  verify:
    if: github.event_name == 'push'
    needs: [deploy]
    runs-on: ubuntu-latest
    name: Verify Deployment

    steps:
      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Health check - Frontend
        run: |
          DEPLOY_URL="${{ vars.PRODUCTION_URL }}"
          if [ -z "$DEPLOY_URL" ]; then
            echo "PRODUCTION_URL not set, skipping health check"
            exit 0
          fi

          echo "Checking frontend health at $DEPLOY_URL..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_URL")

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Frontend health check passed (HTTP $HTTP_STATUS)"
          else
            echo "Frontend health check failed (HTTP $HTTP_STATUS)"
            exit 1
          fi

      - name: Verify critical assets
        run: |
          DEPLOY_URL="${{ vars.PRODUCTION_URL }}"
          if [ -z "$DEPLOY_URL" ]; then
            echo "PRODUCTION_URL not set, skipping asset verification"
            exit 0
          fi

          # Check that index.html loads
          echo "Verifying index.html..."
          curl -sf "$DEPLOY_URL/" > /dev/null && echo "index.html OK" || exit 1

          echo "All critical assets verified."

      - name: Post verification summary
        run: |
          echo "## Deployment Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All health checks passed." >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job: Close Pull Request (Cleanup Preview Environment)
  # ===========================================================================
  # Cleans up the preview environment when a PR is closed.
  # ===========================================================================
  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request

    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
